<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ваша книга — Героёнок</title>
<link rel="stylesheet" href="assets/kit/parchment.css">
<style>
:root{ --ink:#4A3527; --gold:#C99A4B; --text-light:#FBF3E3; --bk-scale:1; } /* палитра листа Героёнка */
*{ box-sizing:border-box; }
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{ margin:0; background:var(--ink); font-family:Arial,sans-serif; }
/* при чтении на экране — «стол» из тёмного дерева; в печать не попадает */
@media screen{ body{ background:#2a1c11 radial-gradient(ellipse at 50% 15%, rgba(255,205,140,.13), transparent 62%) fixed; } #book{ padding-left:26px; } }
.toolbar{ position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 20px; background:rgba(58,41,30,.97); color:var(--text-light); }
.toolbar a.logo{ color:var(--text-light); text-decoration:none; font-family:Georgia,serif; font-size:18px; }
.btn{ background:var(--gold); color:var(--ink); border:none; cursor:pointer; text-decoration:none; padding:10px 20px; border-radius:12px; font-weight:700; font-size:15px; }
.btn.ghost{ background:transparent; color:var(--text-light); border:1px solid rgba(255,255,255,.35); }
.hint{ text-align:center; color:rgba(244,239,224,.6); font-size:13px; margin:14px 16px 0; }
#book{ padding:20px 12px 60px; display:flex; flex-direction:column; align-items:center; gap:24px; }
.empty{ max-width:520px; margin:80px auto; padding:0 20px; color:var(--text-light); text-align:center; line-height:1.6; }
@media print{
  body{ background:#fff; }
  .no-print{ display:none !important; }
  #book{ padding:0; gap:0; display:block; }
}
</style>
<link rel="stylesheet" href="assets/geroenok-states.css">
</head>
<body>

<div class="toolbar no-print">
  <a class="logo" href="index.html">Героёнок</a>
  <div>
    <span id="count" style="color:rgba(244,239,224,.7); margin-right:12px; font-size:14px;"></span>
    <button class="btn ghost" id="listenBtn" type="button">🔊 Слушать книгу</button>
    <button class="btn ghost" id="editBtn" type="button" hidden>✏️ Править книгу</button>
    <button class="btn ghost" id="sequelBtn" type="button" hidden>✨ Заказать продолжение</button>
    <button class="btn" id="pdfBtn" type="button">Скачать PDF</button>
  </div>
</div>
<p class="hint no-print">В окне печати выберите «Сохранить как PDF» и поля «Нет». <a href="how-it-works.html#print" target="_blank" style="color:inherit;">Как напечатать книгу →</a></p>

<main id="book" class="bk-book-view"></main>

<script src="js/book-engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/book-extras.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var root = document.getElementById('book');

  function scale() {
    var s = Math.min(1.45, Math.max(0.4, (window.innerWidth - 24) / 582));
    document.documentElement.style.setProperty('--bk-scale', String(s));
  }
  scale();
  window.addEventListener('resize', scale);

  function start(book, answers, jobId, status) {
    var meta = book.meta || {};
    var name = meta.heroName || (answers && answers.name) || '';
    var girl = meta.heroGirl != null ? meta.heroGirl : !/^(мал|boy|male)/i.test((answers && answers.gender) || '');
    var result = (status && status.result) || {};
    var locked = result.locked ? {
      text: window.SkazkaExtras.lockedText({ chapters: result.lockedChapters, images: result.lockedImages, coloring: true, name: name, girl: girl }),
      button: window.SkazkaExtras.payButton({ jobId: jobId, price: result.price, apiBase: API_BASE })
    } : null;
    window.SkazkaBook.render(book, root, {
      locked: locked,
      frame: params.get('frame'), footer: params.get('footer'),
      onlyGenerated: Boolean(jobId), // заказ клиента: фоновые сцены без героя не показываем
      qr: window.SkazkaExtras.qrBlock('book-pro.html', jobId),
      certificate: name ? window.SkazkaExtras.certificate(name, book.title, girl) : null
    }).then(function (res) {
      document.title = book.title + ' — Героёнок';
      document.getElementById('count').textContent = res.pages + ' стр.';
      window.__bookReady = res;
      if (locked) {
        document.getElementById('pdfBtn').style.display = 'none';
        window.SkazkaExtras.attachListen(document.getElementById('listenBtn'), function () { return listenTexts(book); });
      } else {
        attachActions(book, answers, jobId, status || {});
      }
      if (params.get('print') === '1') setTimeout(function () { window.print(); }, 400);
    });
  }

  document.getElementById('pdfBtn').addEventListener('click', function () { window.print(); });

  function listenTexts(book) {
    var out = [book.title];
    book.chapters.forEach(function (c) {
      out.push('Глава ' + c.n + '. ' + c.title);
      c.blocks.forEach(function (b) { if (b.t === 'p' || b.t === 'card' || b.t === 'scrap') out.push(b.text); });
    });
    return out;
  }

  function attachActions(book, answers, jobId, status) {
    window.SkazkaExtras.attachEditor({
      button: document.getElementById('editBtn'),
      apiBase: API_BASE,
      jobId: jobId,
      canRedraw: status.canRedraw,
      redrawsLeft: status.redrawsLeft,
      editable: function () { return Array.prototype.slice.call(document.querySelectorAll('.bk-content p[data-bi]')); },
      collectEdits: function () {
        return Array.prototype.map.call(document.querySelectorAll('.bk-content p[data-bi]'), function (p) {
          var ch = Number(p.getAttribute('data-ch'));
          var bi = Number(p.getAttribute('data-bi'));
          return { chapter: ch, block: bi, text: window.SkazkaExtras.paragraphText(p) };
        }).filter(function (e) {
          var orig = book.chapters[e.chapter].blocks[e.block].text || '';
          return e.text && e.text.replace(/\s+/g, ' ') !== orig.replace(/\s+/g, ' ');
        });
      },
      images: function () {
        return Array.prototype.map.call(document.querySelectorAll('.bk-page[data-img]'), function (page) {
          return { img: page.querySelector('.bk-ill-img'), host: page, index: Number(page.getAttribute('data-img')) };
        });
      }
    });

    window.SkazkaExtras.attachListen(document.getElementById('listenBtn'), function () {
      var out = [book.title];
      book.chapters.forEach(function (c) {
        out.push('Глава ' + c.n + '. ' + c.title);
        c.blocks.forEach(function (b) { if (b.t === 'p' || b.t === 'card' || b.t === 'scrap') out.push(b.text); });
      });
      return out;
    });
    if (answers && answers.name) {
      var btn = document.getElementById('sequelBtn');
      btn.hidden = false;
      btn.addEventListener('click', function () {
        var chapters = book.chapters.map(function (c) { return c.title; }).join(', ');
        window.SkazkaExtras.orderSequel(answers, book.title, (book.logline ? book.logline + ' ' : '') + 'Главы: ' + chapters + '.');
      });
    }
  }

  // API на том же адресе, что и сайт (локально — `npx wrangler dev`)
  var API_BASE = window.SKAZKA_API_BASE || '';

  // Книга заказана: ждём готовности на сервере и показываем ход работы (пишется глава за главой, это несколько минут)
  function waitForJob(jobId) {
    var box = document.createElement('div');
    box.className = 'gw-card';
    box.innerHTML = '<img class="gw-art" src="assets/brand/pose-reading.webp" alt="Героёнок читает книгу">'
      + '<h2>Героёнок пишет вашу историю</h2><div class="gw-book" aria-hidden="true"><i></i><i></i><i></i></div>'
      + '<p id="jobText" role="status">Начинаем…</p><p class="gw-small">Большая история пишется глава за главой, это занимает несколько минут. Страницу можно не закрывать.</p>';
    root.appendChild(box);
    var text = box.querySelector('#jobText');
    var errors = 0;
    var started = Date.now();
    (function poll() {
      fetch(API_BASE + '/api/book/' + jobId + '/status').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (d) {
        errors = 0;
        if (d.ready && !d.finishing && d.result && d.result.book) { root.textContent = ''; start(d.result.book, d.result.answers, jobId, d); return; }
        text.textContent = d.progress || (d.finishing ? 'Оплата прошла — дорисовываем иллюстрации…' : d.position > 1 ? 'Ваша книга в очереди…' : 'Пишем книгу…');
        setTimeout(poll, 2500);
      }).catch(function () {
        errors += 1;
        if (errors >= 8) { text.textContent = 'Не удаётся связаться с сервером. Обновите страницу через минуту — книга сохранится.'; return; }
        setTimeout(poll, 4000);
      });
    })();
  }

  if (params.get('job')) {
    waitForJob(params.get('job'));
  } else if (params.get('demo') === 'newyear') {
    // образец оформлений Нового года: ?demo=newyear&design=cookies (по умолчанию) или design=elves
    var design = params.get('design') === 'elves' ? 'elves' : 'cookies';
    var sd = document.createElement('script');
    sd.src = 'assets/demo-newyear.js';
    sd.onload = function () {
      var b = window.SKAZKA_DEMO_NEWYEAR;
      b.genre = design === 'elves' ? 'newyear_elves' : 'newyear';
      b.frame = design; b.footer = design;
      start(b);
    };
    document.body.appendChild(sd);
  } else if (params.get('demo') === 'travel') {
    // образец оформлений «Путешествия»: design=pirates|jungle (5–10 лет) или rope|chart|fern («Пергамент», 11–16)
    var tdesign = params.get('design') || 'pirates';
    var tmap = { pirates: ['pirates', 'pirates'], jungle: ['jungle', 'jungle'], rope: ['rope', 'sea'], chart: ['chart', 'treasure'], fern: ['fern', 'wild'] };
    var tpair = tmap[tdesign] || tmap.pirates;
    var st = document.createElement('script');
    st.src = 'assets/demo-travel.js';
    st.onload = function () { var b = window.SKAZKA_DEMO_TRAVEL; b.frame = tpair[0]; b.footer = tpair[1]; start(b); };
    document.body.appendChild(st);
  } else if (params.get('demo') === 'alex') {
    // локальный тест на образце: данные лежат только на компьютере автора
    var s = document.createElement('script');
    s.src = 'assets/kit/alex/alex-book.js';
    s.onload = function () { start(window.SKAZKA_ALEX_BOOK); };
    s.onerror = function () { root.innerHTML = '<div class="empty">Тестовая книга не найдена.</div>'; };
    document.body.appendChild(s);
  } else {
    root.innerHTML = '<div class="empty"><h2>Книга пока не создана</h2><p>Эта страница показывает книгу тарифа «Большая история».</p></div>';
  }
})();
</script>
</body>
</html>
