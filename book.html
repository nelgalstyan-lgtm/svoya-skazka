<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ваша книга — Героёнок</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400;1,7..72,700&family=Caveat:wght@600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap');

:root{
  --ink:#4A3527; --gold:#C99A4B; --gold-dark:#8C6428; /* палитра листа Героёнка (docs/brand) */
  --cream:#FBF7ED; --text:#241F33; --text-soft:#514A63; --text-light:#F4EFE0; --line:#DCCEA9;
  --font-display:'Lora',Georgia,serif; --font-book:'Literata',Georgia,serif; --font-script:'Caveat',cursive; --font-body:'PT Sans',Arial,sans-serif;
  --scale:1;
}
*{box-sizing:border-box;}
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{ margin:0; background:var(--ink); font-family:var(--font-body); color:var(--text); }

/* ---------- Верхняя панель ---------- */
.toolbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:12px 20px; background:rgba(58,41,30,.97); color:var(--text-light);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo{ font-family:var(--font-display); font-size:18px; color:var(--text-light); text-decoration:none; }
.logo em{ font-family:var(--font-script); font-style:normal; color:var(--gold); }
.toolbar-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.btn{
  background:var(--gold); color:var(--ink); border:none; cursor:pointer; text-decoration:none;
  padding:10px 20px; border-radius:12px; font-weight:700; font-size:15px; font-family:var(--font-body);
}
.btn.ghost{ background:transparent; color:var(--text-light); border:1px solid rgba(255,255,255,.35); }
.hint{ text-align:center; color:rgba(244,239,224,.6); font-size:13px; margin:14px 16px 0; }

/* ---------- Лист книги (A4, 794×1123 px, масштабируется на экране) ---------- */
.book{ padding:20px 12px 60px; display:flex; flex-direction:column; align-items:center; gap:26px; }
.sheet-wrap{ width:calc(794px * var(--scale)); height:calc(1123px * var(--scale)); flex:none; }
.sheet{
  width:794px; height:1123px; position:relative; overflow:hidden;
  transform:scale(var(--scale)); transform-origin:0 0;
  background:
    radial-gradient(ellipse 320px 240px at 6% 4%, rgba(122,150,120,.20), transparent 62%),
    radial-gradient(ellipse 380px 300px at 98% 100%, rgba(178,132,58,.16), transparent 62%),
    radial-gradient(ellipse 260px 200px at 94% 6%, rgba(90,120,160,.10), transparent 62%),
    var(--cream);
  box-shadow:0 25px 55px -20px rgba(0,0,0,.6);
  display:flex; flex-direction:column;
}
.sheet::after{
  content:""; position:absolute; inset:16px; border:1.5px solid var(--frame, rgba(122,90,50,.28)); border-radius:4px; pointer-events:none;
}

/* ---------- Фирменное оформление (как у «Большой истории»): светлая бумага, коричневые чернила,
   акварельные предметы темы из assets/kit/decor/<набор>/ — заставки, веточки у номера страницы, Героёнок в конце ---------- */
.sheet:not(.art):not(.back):not(.coloring){
  background:linear-gradient(rgba(248,243,230,.8), rgba(248,243,230,.8)), url(assets/kit/parchment.jpg) center/100% 100% no-repeat #f6efdf;
}
.sheet::after{ display:none; }
.cover.art::after, .back::after{ display:block; }
.decor{ display:block; }
.teen .decor{ filter:sepia(.4) saturate(.7); opacity:.92; }
.vignette{ display:flex; justify-content:center; align-items:flex-end; margin-top:26px; }
.vignette img{ width:380px; height:auto; }
.teen .vignette img{ width:300px; }
.vignette img.vg-main{ width:120px; margin:0 -8px; position:relative; z-index:1; }
.vignette img.vg-side{ width:112px; }
.mirror{ transform:scaleX(-1); }
.cover .vignette{ margin-top:18px; }
.cover .vignette img{ width:280px; }

/* Иллюстрация-сцена сверху */
.scene{
  margin:60px 60px 0; height:334px; flex:none; border-radius:6px; overflow:hidden;
  box-shadow:0 10px 26px -12px rgba(60,40,10,.55);
}
.scene img{ width:100%; height:100%; object-fit:cover; display:block; }

/* Текст */
.story{
  flex:1; overflow:hidden; padding:30px 68px 74px; font-family:var(--font-book);
  font-size:calc(var(--fs, 19.5px)); line-height:1.72; color:var(--text);
}
.story p{ margin:0 0 .55em; }
.story .dropcap{
  font-family:var(--font-display); font-weight:700; font-size:3.5em; color:#9a6a33;
  float:left; line-height:.86; margin:.06em .12em 0 0;
}
.hero{
  float:left; width:318px; height:486px; margin:2px 30px 14px 0; border-radius:8px; overflow:hidden;
  box-shadow:0 14px 30px -14px rgba(60,40,10,.6); shape-outside:margin-box;
}
.hero img{ width:100%; height:100%; object-fit:cover; display:block; }
.hero, .scene{ position:relative; }
.pageno{
  position:absolute; bottom:30px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:14px;
  font-family:var(--font-display); font-weight:600; font-size:20px; color:#5b4128;
}
.pageno img{ height:48px; width:auto; max-width:64px; object-fit:contain; }
.teen .pageno img{ height:38px; }

/* Обложка и финал */
.cover, .finale{ align-items:center; text-align:center; }
.kicker{ margin-top:92px; font-size:14px; letter-spacing:.32em; text-transform:uppercase; color:var(--text-soft); }
.cover h1{
  margin:26px 84px 0; font-family:var(--font-display); font-weight:700; font-size:50px; line-height:1.22; color:var(--ink);
}
.orn{ margin:26px 0 0; color:var(--gold-dark); font-size:22px; letter-spacing:.7em; padding-left:.7em; }
.cover .scene{ margin:36px 60px 0; height:400px; align-self:stretch; }
.for{ margin-top:46px; font-family:var(--font-script); font-weight:700; font-size:40px; color:var(--gold-dark); }
.for small{ display:block; font-family:var(--font-body); font-weight:400; font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-soft); margin-bottom:4px; }
.brand{ position:absolute; bottom:44px; left:0; right:0; font-family:var(--font-display); font-size:17px; color:var(--text-soft); }
.brand em{ font-family:var(--font-script); font-style:normal; font-size:1.3em; color:var(--gold-dark); }
/* Обложка с иллюстрацией ребёнка: картинка на весь лист, название набрано поверх */
.cover.art{ padding:0; justify-content:flex-start; background:#1c1a24; }
.cover.art::after{ border-color:rgba(255,240,210,.35); z-index:2; }
.cover-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* затемнения на всю высоту листа: край слоя посередине обложки html2canvas рисует тёмной линией в PDF */
.cover.art::before{ content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(rgba(18,16,30,.74), rgba(18,16,30,.35) 27.6%, rgba(18,16,30,0) 46%); }
.cover-shade{ position:absolute; inset:0; z-index:1; background:linear-gradient(rgba(18,16,30,0) 68%, rgba(18,16,30,.78)); }
.cover.art .kicker, .cover.art h1, .cover.art .orn, .cover.art .for, .cover.art .brand{ position:relative; z-index:2; }
.cover.art .kicker{ color:rgba(255,244,222,.85); }
.cover.art h1{ color:#fff3d6; text-shadow:0 3px 18px rgba(0,0,0,.55); }
.cover.art .orn{ color:var(--gold); }
.cover.art .for{ position:absolute; bottom:96px; left:0; right:0; margin:0; color:#ffd98f; text-shadow:0 2px 10px rgba(0,0,0,.6); }
.cover.art .for small{ color:rgba(255,244,222,.85); }
.cover.art .brand{ position:absolute; color:rgba(255,244,222,.8); }
.cover.art .brand em{ color:var(--gold); }
.finale .scene{ margin:110px 70px 0; align-self:stretch; height:327px; }
.finale h2:first-child{ margin-top:150px; }
.cover:not(.art) h1{ margin-top:120px; }
.text-page .story{ padding-top:90px; }
/* «Сказка» для малышей: иллюстрация — на весь лист, текст — на следующем листе крупным шрифтом */
/* короткий текст — по центру листа, длинный — сверху (safe: не уезжает за верхний край) */
.text-page .story{ display:flex; flex-direction:column; justify-content:safe center; padding-top:70px; }
.pic-page{ padding:0; background:#1c1a24; }
/* над текстом — акварельный предмет темы, на каждой странице свой (item-N-big: 1–8 — предметы, 9–10 — веточки) */
.text-page.has-item .story{ padding-top:22px; }
.page-item{ flex:none; display:flex; justify-content:center; align-items:flex-end; height:var(--ih, 160px); margin:58px 0 0; }
.page-item img{ height:100%; width:auto; max-width:60%; object-fit:contain; }
/* боковая полоса темы у левого края листа с текстом; в PDF у правых страниц переносится к внешнему краю
   (mirrorForBinding в js/book-extras.js → .sk-strip-right), чтобы в переплёте не уйти в клей */
.sk-strip{ position:absolute; top:0; bottom:0; left:0; width:88px; background-position:left top; background-size:88px 100%; background-repeat:no-repeat; z-index:1; }
.has-strip .story{ padding-left:128px; }
.has-strip .page-item, .has-strip .pageno{ padding-left:60px; }
.sk-strip-right .sk-strip{ left:auto; right:0; transform:scaleX(-1); }
.sk-strip-right .story{ padding-left:68px; padding-right:128px; }
.sk-strip-right .page-item, .sk-strip-right .pageno{ padding-left:0; padding-right:60px; }
.pic-page .hero{ position:absolute; inset:0; float:none; width:auto; height:auto; margin:0; border-radius:0; box-shadow:none; }
.qr-block{ display:flex; align-items:center; gap:18px; margin:26px 110px 0; text-align:left; }
.qr-code{ width:104px; height:104px; flex:none; padding:8px; background:#fff; border-radius:8px; box-shadow:0 4px 12px rgba(60,40,10,.18); }
.qr-code svg{ width:100%; height:100%; display:block; }
.qr-text{ font-family:var(--font-body); font-size:15px; line-height:1.5; color:var(--text-soft); }

/* Сертификат «Герой книги» */
.dedication{ align-items:center; text-align:center; justify-content:center; padding:0 120px; }
.ded-title{ font-family:var(--font-display); font-weight:700; font-size:38px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); }
.dedication .vignette{ margin:22px 0 34px; }
.ded-lead{ font-family:var(--font-book); font-style:italic; font-weight:700; font-size:22px; line-height:1.6; color:var(--text); margin:0 0 22px; }
.ded-text{ font-family:var(--font-book); font-style:italic; font-size:19px; line-height:1.75; color:var(--text-soft); margin:0 0 14px; }
.ded-sign{ margin-top:40px; }
.ded-date{ font-size:15px; letter-spacing:.08em; color:var(--text-soft); margin-bottom:8px; }
.ded-hand{ font-family:var(--font-script); font-weight:700; font-size:40px; line-height:1.15; color:var(--gold-dark); }
/* задняя обложка: иллюстрация в арке, текст о герое, знак Героёнка (нужна для печати в твёрдом переплёте) */
.back{ background:#1c1a24 radial-gradient(ellipse at 50% 30%, #34304a, #1c1a24 70%) !important; align-items:center; text-align:center; color:#f4ead6; }
.back::after{ border-color:rgba(201,154,75,.55); }
.back.no-art .back-text{ margin:auto 110px; }
.back-arch{ margin-top:90px; width:500px; height:560px; border-radius:260px 260px 12px 12px; overflow:hidden; border:4px solid #c99a4b; box-shadow:0 0 0 8px rgba(201,154,75,.18), 0 18px 40px rgba(0,0,0,.5); }
.back-arch img{ width:100%; height:100%; object-fit:cover; display:block; }
.back-text{ margin:44px 110px 0; font-family:var(--font-book); font-style:italic; font-size:24px; line-height:1.6; color:#f4ead6; text-wrap:pretty; }
.back-foot{ position:absolute; left:80px; right:80px; bottom:70px; display:flex; align-items:center; justify-content:center; gap:16px; }
.back-seal{ width:70px; height:70px; object-fit:contain; padding:5px; border-radius:50%; background:#f4ead6; }
.back-brand{ font-family:var(--font-display); font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:#ffd98f; text-align:left; }
.back-brand small{ display:block; margin-top:6px; font-weight:400; font-size:18px; letter-spacing:.06em; text-transform:none; color:#e8dcc0; }
.back.has-qr .back-arch{ height:470px; }
.back.has-qr .back-foot{ right:auto; justify-content:flex-start; }
.back-qr{ position:absolute; right:74px; bottom:56px; width:176px; padding:12px 12px 10px; background:#f4ead6; border:3px solid #c99a4b; border-radius:14px; text-align:center; z-index:3; display:flex; flex-direction:column-reverse; }
.back-qr .qr-code{ width:148px; height:148px; margin:0 auto; padding:5px; background:#fffaf0; border-radius:6px; box-shadow:none; }
.back-qr .qr-text{ margin-bottom:8px; font-family:var(--font-display); font-weight:700; font-size:14px; line-height:1.3; letter-spacing:.05em; text-transform:uppercase; color:#3f2816; }
.back.has-qr .back-age{ position:static; margin-left:6px; }
.back-age{ position:absolute; right:0; bottom:14px; padding:7px 14px; border:1px solid rgba(201,154,75,.6); border-radius:6px; font-size:18px; color:#e8dcc0; }
.cert{ align-items:center; text-align:center; justify-content:center; }
.cert::before{ content:""; position:absolute; inset:40px; border:3px double var(--gold-dark); border-radius:10px; pointer-events:none; }
.cert-kicker{ font-size:15px; letter-spacing:.4em; padding-left:.4em; text-transform:uppercase; color:var(--text-soft); }
.cert-title{ margin-top:14px; font-family:var(--font-display); font-weight:700; font-size:46px; color:var(--ink); }
.cert-medal{ margin:30px 0 8px; width:84px; height:auto; }
.cert-portrait{ margin:30px 0 10px; width:210px; height:210px; border-radius:50%; background-repeat:no-repeat; background-size:160% auto; background-position:50% 30%; border:5px solid #c99a4b; box-shadow:0 0 0 8px rgba(201,154,75,.2), 0 10px 22px rgba(60,35,10,.35); }
.cert-name{ font-family:var(--font-script); font-weight:700; font-size:76px; color:var(--gold-dark); line-height:1.1; }
.cert-text{ margin:26px 110px 0; font-family:var(--font-book); font-size:19px; line-height:1.8; color:var(--text); }
.cert-foot{ display:flex; justify-content:space-between; width:calc(100% - 220px); margin-top:70px; font-size:15px; color:var(--text-soft); }
.cert-foot b{ display:block; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-weight:400; }
.cert-foot{ align-items:flex-end; }
.cert-sign{ display:flex; align-items:center; gap:14px; }
.cert-seal{ width:84px; height:84px; object-fit:contain; padding:6px; border-radius:50%; border:2px solid var(--gold-dark); box-shadow:0 0 0 4px rgba(201,154,75,.18); transform:rotate(-6deg); }
.cert-signature{ display:block; font-family:var(--font-script); font-weight:700; font-size:46px; line-height:1; color:var(--gold-dark); transform:rotate(-4deg); }

/* Песня по книге: название и слова; припев — курсивом, второй раз — пометкой */
.song{ align-items:center; text-align:center; }
.song-kicker{ margin-top:92px; font-size:15px; letter-spacing:.4em; padding-left:.4em; text-transform:uppercase; color:var(--text-soft); }
.song-title{ margin:12px 110px 0; font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1.15; color:var(--ink); text-wrap:balance; }
.song .song-lyrics{ margin:30px 110px 0; font-family:var(--font-book); font-size:19px; line-height:28px; color:var(--text); }
.song .song-part{ margin-bottom:16px; }
.song .song-chorus, .song .song-repeat{ font-style:italic; color:var(--gold-dark); }
.song .song-label{ font-size:13px; line-height:20px; letter-spacing:.25em; text-transform:uppercase; color:var(--text-soft); font-style:normal; }
.song-note{ position:absolute; left:0; right:0; bottom:70px; font-family:var(--font-book); font-style:italic; font-size:16px; color:var(--text-soft); }

/* Раскраска: контурная картинка на белом листе */
/* Закрытая страница превью: остальная книга — после оплаты */
.locked{ align-items:center; justify-content:center; text-align:center; padding:0 90px; }
.locked-icon{ font-size:64px; line-height:1; }
.locked h2{ margin:22px 0 0; font-family:var(--font-display); font-size:36px; color:var(--ink); }
.locked p{ margin:18px 0 30px; font-family:var(--font-book); font-size:19px; line-height:1.75; color:var(--text-soft); }
.locked small{ display:block; margin-top:16px; font-size:14px; color:var(--text-soft); }
.coloring{ background:#fff !important; align-items:center; }
.coloring-title{ margin-top:58px; font-family:var(--font-script); font-weight:700; font-size:40px; color:var(--gold-dark); }
.coloring img{ margin-top:18px; width:640px; height:930px; object-fit:contain; }
.finale h2{ margin:120px 70px 0; font-family:var(--font-display); font-weight:700; font-size:72px; color:#4a3220; line-height:1; }
.finale-hare{ margin-top:34px; width:190px; height:auto; }
.finale p{ margin:20px 110px 0; font-family:var(--font-book); font-size:19px; line-height:1.8; color:var(--text); }

.empty{ max-width:520px; margin:80px auto; padding:0 20px; color:var(--text-light); text-align:center; line-height:1.6; }
.empty h2{ font-family:var(--font-display); }

/* ---------- Печать / PDF ---------- */
@page{ size:210mm 297mm; margin:0; }
@media print{
  body{ background:#fff; }
  .no-print{ display:none !important; }
  .book{ padding:0; gap:0; display:block; }
  .sheet-wrap{ width:210mm !important; height:297mm !important; overflow:hidden; page-break-after:always; break-after:page; }
  .sheet-wrap:last-child{ page-break-after:auto; break-after:auto; }
  .sheet{ transform:none !important; box-shadow:none; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

<script>
(function () {
  const SHEET_W = 794;
  const STORAGE_KEY = 'skazka:lastBook';

  // Пока иллюстрации с лицом ребёнка готовятся вручную, они подключаются по имени.
  // Для всех остальных «геройский» разворот получает фоновую сцену — то же самое произойдёт,
  // если генерация иллюстрации в будущем не удастся.
  const HERO_IMAGES = { 'милена': 'assets/hero/milena-watercolor.jpg' };

  const params = new URLSearchParams(location.search);
  const root = document.getElementById('book');
  // фоновые сцены — только у старого образца ?demo=1; у образцов с иллюстрациями (?demo=max3d) их нет
  const SCENES = params.get('demo') === '1';

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // Адрес бэкенда — как на странице анкеты
  // API на том же адресе, что и сайт (локально — `npx wrangler dev`)
  const API_BASE = window.SKAZKA_API_BASE || '';

  // Книга с иллюстрациями не помещается в хранилище браузера — по ссылке ?job= берём её с сервера
  // Книга ещё рисуется (открыли по ссылке раньше времени) — показываем ход работы и ждём
  function waitNote(text) {
    let box = document.getElementById('waitNote');
    if (!box) {
      box = el('div', 'gw-card');
      box.id = 'waitNote';
      const art = el('img', 'gw-art'); art.src = 'assets/brand/pose-reading.webp'; art.alt = 'Героёнок читает книгу';
      const book = el('div', 'gw-book'); book.setAttribute('aria-hidden', 'true'); book.innerHTML = '<i></i><i></i><i></i>';
      const p = el('p', ''); p.setAttribute('role', 'status');
      box.append(art, el('h2', '', 'Героёнок дорисовывает вашу книгу'), book, p);
      root.appendChild(box);
    }
    box.querySelector('p').textContent = text || 'Это займёт несколько минут. Страницу можно не закрывать — книга появится сама.';
  }

  async function loadFromServer(jobId) {
    const r = await fetch(API_BASE + '/api/book/' + encodeURIComponent(jobId) + '/result');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.ready || d.finishing) {
      waitNote(d.finishing ? (d.progress || 'Оплата прошла — дорисовываем остальные иллюстрации. Это займёт несколько минут.') : d.progress);
      await new Promise(function (resolve) { setTimeout(resolve, 3000); });
      return loadFromServer(jobId);
    }
    const note = document.getElementById('waitNote');
    if (note) note.remove();
    if (!d.result || !Array.isArray(d.result.pages)) throw new Error('not ready');
    return { answers: d.result.answers || {}, book: d.result, jobId: jobId, canRedraw: d.canRedraw, redrawsLeft: d.redrawsLeft, locked: Boolean(d.result.locked) };
  }

  function loadBook() {
    if (params.get('demo') === '1') return window.SKAZKA_DEMO_BOOK || null;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      // сохранённая книга без картинок: если сервер её ещё помнит, берём полную версию по jobId (см. ниже)
      if (saved && saved.book && Array.isArray(saved.book.pages)) return saved;
    } catch (e) { /* хранилище недоступно */ }
    return null;
  }

  // Абзацы: диалог начинается с новой строки, длинные куски делим по предложениям
  function toParagraphs(text) {
    let parts = String(text).split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (parts.length === 1 && parts[0].length > 420) {
      const sentences = parts[0].split(/(?<=[.!?…»])\s+(?=[А-ЯЁA-Z—«])/);
      parts = [];
      let buf = '';
      sentences.forEach(function (s) {
        const dialogue = /^[—«]/.test(s);
        if (buf && (dialogue || buf.length > 300)) { parts.push(buf); buf = ''; }
        buf += (buf ? ' ' : '') + s;
      });
      if (buf) parts.push(buf);
    }
    return parts;
  }

  // Набор акварельных предметов по теме (как DECOR в js/book-engine.js): sprig — веточка у номера страницы;
  // у дня рождения своей заставки нет — торт между веточками
  // folio — свои предметы у номера страницы (у приключений листики ни о чём не говорят): часы и сундучок
  // strip — боковая полоса на листах с текстом (assets/kit/decor/<набор>/strip.webp; у остальных наборов — когда нарисуют)
  const DECOR = { tajny: { sprig: 9, folio: [6, 3], strip: true }, korolevstvo: { sprig: 9, boyFolio: [7, 6] }, 'novyj-god': { sprig: 10 }, 'den-rozhdeniya': { sprig: 9, compose: [9, 1, 10] } };
  const DECOR_BY_THEME = { adventure: 'tajny', fairytale: 'korolevstvo', newyear: 'novyj-god', birthday: 'den-rozhdeniya' };
  let SET = 'tajny';
  let BOY = false;
  const decorSrc = (n, set) => 'assets/kit/decor/' + (set || SET) + '/item-' + n + '.webp';
  function decorImg(src, cls) { const i = el('img', 'decor' + (cls ? ' ' + cls : '')); i.src = src; i.alt = ''; return i; }
  function vignetteEl(set) {
    set = set || SET;
    const box = el('div', 'vignette');
    const c = DECOR[set].compose;
    if (c) c.forEach(function (n, i) { box.appendChild(decorImg(decorSrc(n, set), i === 1 ? 'vg-main' : 'vg-side' + (i === 2 ? ' mirror' : ''))); });
    else box.appendChild(decorImg('assets/kit/decor/' + set + '/vignette.webp'));
    return box;
  }
  function pageNumber(n, sprigOnly) {
    const box = el('div', 'pageno');
    // на листе с крупным предметом у номера — веточки, чтобы предметы не повторялись
    const f = !sprigOnly && ((BOY && DECOR[SET].boyFolio) || DECOR[SET].folio); // у королевства розы — героиням, героям кубок и арфа
    if (f) box.append(decorImg(decorSrc(f[0])), el('span', '', String(n)), decorImg(decorSrc(f[1])));
    else box.append(decorImg(decorSrc(DECOR[SET].sprig), 'mirror'), el('span', '', String(n)), decorImg(decorSrc(DECOR[SET].sprig)));
    return box;
  }

  function sheet(className) {
    const wrap = el('div', 'sheet-wrap');
    const node = el('div', 'sheet' + (className ? ' ' + className : ''));
    wrap.appendChild(node);
    root.appendChild(wrap);
    return node;
  }

  function sceneBlock(tag, alt) {
    const box = el('div', 'scene');
    const img = document.createElement('img');
    img.src = 'assets/scenes/' + tag + '.jpg';
    img.alt = alt || '';
    img.loading = 'eager';
    box.appendChild(img);
    return box;
  }

  function addStory(parent, text) {
    const story = el('div', 'story');
    toParagraphs(text).forEach(function (para, i) {
      const p = el('p');
      if (i === 0) {
        p.appendChild(el('span', 'dropcap', para.charAt(0)));
        p.appendChild(document.createTextNode(para.slice(1)));
      } else {
        p.textContent = para;
      }
      story.appendChild(p);
    });
    parent.appendChild(story);
    return story;
  }

  // Обложка и финал берут сцену под тему+повод — праздничная книга не должна открываться замком из «Путешествия»
  // Сказка в короткой книге пока без выбора жанра (kingdom/forest/underwater — это только у «Большой истории»),
  // поэтому обложка и финал берут вариант «королевство» — как и локальный текстовый шаблон сказки
  const COVER_SCENE = { adventure: 'castle_gate', fairytale: 'castle_ballroom', birthday: 'party_room', newyear: 'tree_lights' };
  const FINALE_SCENE = { adventure: 'treasure_room', fairytale: 'garden_maze', birthday: 'confetti_moment', newyear: 'midnight_fireworks' };

  function themeOf(answers) {
    const c = window.SkazkaTemplate.normalizeInput(answers || {});
    if (c.kind === 'holiday') return window.SkazkaTemplate.holidayKind(c.occasion);
    // повод «Новый год» у любой темы — новогодние обложка и финал (день рождения и свои поводы — сцены темы)
    return window.SkazkaTemplate.occasionKind(c.occasion) === 'newyear' ? 'newyear' : c.kind;
  }

  function coverAndFinaleScenes(answers) {
    const kind = themeOf(answers);
    return { cover: COVER_SCENE[kind] || 'castle_gate', finale: FINALE_SCENE[kind] || 'treasure_room' };
  }

  // Задняя обложка: book.backImage или последняя иллюстрация с ребёнком (или обложка), текст о герое и знак Героёнка
  function backCover(book, name, girl, jobId) {
    const back = sheet('back');
    let src = book.cover || '';
    book.pages.forEach(function (p) { if (p.heroImage) src = p.heroImage; });
    if (book.backImage) src = book.backImage;
    if (src) {
      const arch = el('div', 'back-arch');
      const pic = document.createElement('img'); pic.src = src; pic.alt = '';
      arch.appendChild(pic);
      back.appendChild(arch);
    } else back.classList.add('no-art');
    back.appendChild(el('p', 'back-text', book.blurb || (name
      ? (girl ? 'Главная героиня' : 'Главный герой') + ' этой сказки — ' + name + '. Не выдуманный персонаж, а настоящий ребёнок: ' + (girl ? 'она нарисована' : 'он нарисован')
        + ' по фото на обложке и на иллюстрациях, а история написана специально для ' + (girl ? 'неё' : 'него')
        + ' — с ' + (girl ? 'её' : 'его') + ' привычками, друзьями и любимыми игрушками.'
      : 'Эта сказка написана для одного-единственного читателя. Её герой — настоящий ребёнок, нарисованный по фото.')));
    const foot = el('div', 'back-foot');
    const seal = el('img', 'back-seal'); seal.src = 'assets/brand/logo-mark-alpha.png'; seal.alt = '';
    const brand = el('div', 'back-brand', 'Героёнок');
    brand.appendChild(el('small', '', 'geroenok.online'));
    foot.append(seal, brand, el('div', 'back-age', '0+'));
    back.appendChild(foot);
    // QR на онлайн-версию книги (в ней «Слушать»)
    // у образца нет заказа — свой QR из book.backQr { label, url } (как у «Большой истории»)
    const qr = book.backQr
      ? window.SkazkaExtras.qrBlock('', null, 'back-qr', book.backQr.label, book.backQr.url)
      : window.SkazkaExtras.qrBlock('book.html', jobId, 'back-qr', 'Читать и слушать');
    if (qr) { back.classList.add('has-qr'); back.appendChild(qr); }
  }

  function render(data) {
    const book = data.book;
    const name = (data.answers && data.answers.name) || '';
    const demoHeroSrc = HERO_IMAGES[name.trim().toLowerCase()];
    const scenes = coverAndFinaleScenes(data.answers);
    document.body.classList.add('t-' + themeOf(data.answers));
    SET = DECOR_BY_THEME[themeOf(data.answers)] || 'tajny';
    const answers = window.SkazkaTemplate.normalizeInput(data.answers || {});
    if (answers.age >= 11) document.body.classList.add('teen'); // подросткам предметы спокойнее
    BOY = !answers.girl;
    const birthday = answers.kind !== 'holiday' && window.SkazkaTemplate.occasionKind(answers.occasion) === 'birthday';
    document.title = book.title + ' — Героёнок';

    // Обложка: с иллюстрацией ребёнка — картинка на весь лист; без неё — фон темы в рамке
    const cover = sheet(book.cover ? 'cover art' : 'cover');
    if (book.cover) {
      const art = document.createElement('img');
      art.className = 'cover-img';
      art.src = book.cover;
      art.alt = book.title;
      cover.appendChild(art);
      cover.appendChild(el('div', 'cover-shade'));
    }
    cover.appendChild(el('div', 'kicker', 'Персональная книга'));
    cover.appendChild(el('h1', '', book.title));
    cover.appendChild(book.cover ? el('div', 'orn', '✦ ✦ ✦') : vignetteEl());
    if (!book.cover && SCENES) cover.appendChild(sceneBlock(scenes.cover, 'Обложка'));
    if (name) {
      const who = el('div', 'for');
      who.appendChild(el('small', '', 'Главный герой'));
      who.appendChild(document.createTextNode(name));
      cover.appendChild(who);
    }
    const brand = el('div', 'brand');
    brand.append('Героёнок');
    cover.appendChild(brand);

    // посвящение от того, кто дарит (есть, только если родители подписали книгу или написали своё)
    if (book.dedication) {
      const d = book.dedication;
      const ded = sheet('dedication');
      ded.appendChild(el('div', 'ded-title', d.title || 'Посвящается'));
      ded.appendChild(vignetteEl(birthday ? 'den-rozhdeniya' : SET));
      if (d.lead) ded.appendChild(el('p', 'ded-lead', d.lead));
      (d.paragraphs || []).forEach(function (t) { ded.appendChild(el('p', 'ded-text', t)); });
      if (d.signature) {
        const sign = el('div', 'ded-sign');
        if (d.date) sign.appendChild(el('div', 'ded-date', d.date));
        String(d.signature).split('\n').forEach(function (line) { sign.appendChild(el('div', 'ded-hand', line)); });
        ded.appendChild(sign);
      }
    }

    // Развороты
    book.pages.forEach(function (page, index) {
      // сгенерированная иллюстрация с реальным лицом ребёнка — в приоритете; демо-фото по имени — запасной вариант для примеров
      const heroSrc = page.heroImage || demoHeroSrc;
      const useHero = page.hero && heroSrc;
      if (useHero) {
        // иллюстрация на весь лист перед текстом (data-pic — для «Перерисовать»)
        const pic = sheet('pic-page');
        pic.setAttribute('data-pic', String(index));
        const frame = el('div', 'hero');
        const img = document.createElement('img');
        img.src = heroSrc;
        img.alt = name;
        frame.appendChild(img);
        pic.appendChild(frame);
      }
      const s = sheet('');
      s.setAttribute('data-page', String(index));
      const scene = page.scene || 'forest_path';

      if (useHero) {
        s.classList.add('text-page', 'has-item');
        if (DECOR[SET].strip) {
          s.classList.add('has-strip');
          const strip = el('div', 'sk-strip');
          strip.style.backgroundImage = 'url("assets/kit/decor/' + SET + '/strip.webp")';
          s.appendChild(strip);
        }
        const item = el('div', 'page-item');
        item.appendChild(decorImg('assets/kit/decor/' + SET + '/item-' + (index % 8 + 1) + '-big.webp'));
        s.appendChild(item);
        addStory(s, page.text);
      } else if (SCENES) {
        // образец на сайте — с фоновыми сценами; в книге клиента фонов нет
        s.appendChild(sceneBlock(scene));
        addStory(s, page.text);
      } else {
        s.classList.add('text-page');
        addStory(s, page.text);
      }
      s.appendChild(pageNumber(index + 1, Boolean(useHero)));
    });

    // Финал
    const end = sheet('finale');
    if (SCENES) end.appendChild(sceneBlock(scenes.finale));
    end.appendChild(el('h2', '', 'Конец'));
    // Героёнок, хранитель историй, прощается с читателем (прозрачный фон — переживает сборку PDF)
    // (у образца сверху сцена — Героёнку там не хватит места)
    if (!SCENES) end.appendChild(decorImg('assets/kit/decor/hare-greeting.webp', 'finale-hare'));
    end.appendChild(el('p', '', 'Эта книга написана по вашей анкете — со всеми привычками, друзьями и близкими героя. Пусть она возвращается к вам снова и снова.'));
    const qr = window.SkazkaExtras.qrBlock('book.html', data.jobId);
    if (qr) end.appendChild(qr); else end.appendChild(vignetteEl());
    const brand2 = el('div', 'brand');
    brand2.append('Героёнок');
    end.appendChild(brand2);

    // Превью: вместо финала — закрытая страница с тем, что ещё будет в книге, и кнопкой оплаты
    if (data.locked) {
      end.parentNode.remove();
      const lock = sheet('locked');
      const key = el('img', 'locked-art'); key.src = 'assets/brand/item-key.webp'; key.alt = 'Золотой ключик — дверь в продолжение истории';
      lock.appendChild(key);
      lock.appendChild(el('h2', '', 'Продолжение — в полной книге'));
      lock.appendChild(el('p', '', window.SkazkaExtras.lockedText({
        pages: book.lockedPages, name: name || 'ваш ребёнок',
        girl: window.SkazkaTemplate.normalizeInput(data.answers || {}).girl, coloring: book.coloringOrdered
      })));
      lock.appendChild(window.SkazkaExtras.payButton({ jobId: data.jobId, price: book.price, apiBase: API_BASE }));
      lock.appendChild(el('small', '', 'Все иллюстрации дорисуются сразу после оплаты — за несколько минут.'));
      backCover(book, name, window.SkazkaTemplate.normalizeInput(data.answers || {}).girl, data.jobId);
      return;
    }

    // Сертификат героя — для имени из анкеты
    if (name) {
      const girl = window.SkazkaTemplate.normalizeInput(data.answers || {}).girl;
      const c = window.SkazkaExtras.certificate(name, book.title, girl);
      const cert = sheet('cert');
      cert.appendChild(el('div', 'cert-kicker', c.kicker));
      cert.appendChild(el('div', 'cert-title', c.title));
      // портрет героя из обложки (не фото: фото храним не дольше 48 часов); без обложки — звезда
      let medal;
      if (book.cover) {
        medal = el('div', 'cert-portrait');
        medal.style.backgroundImage = 'url("' + String(book.cover).replace(/"/g, '%22') + '")';
      } else {
        medal = el('img', 'cert-medal'); medal.src = 'assets/brand/item-star-alpha.png'; medal.alt = '';
      }
      cert.appendChild(medal);
      cert.appendChild(el('div', 'cert-name', c.name));
      cert.appendChild(el('p', 'cert-text', c.text));
      const foot = el('div', 'cert-foot');
      const d = el('div', '', c.date); d.appendChild(el('b', '', 'дата'));
      // подпись: печать с Героёнком и росчерк «Героёнок» (PNG с прозрачностью — переживает сборку PDF)
      const sgn = el('div', 'cert-sign');
      const seal = el('img', 'cert-seal'); seal.src = 'assets/brand/logo-mark-alpha.png'; seal.alt = 'Печать Героёнка';
      const hand = el('div', 'cert-hand');
      hand.append(el('span', 'cert-signature', 'Героёнок'), el('b', '', 'хранитель историй'));
      sgn.append(seal, hand);
      foot.append(d, sgn);
      cert.appendChild(foot);
    }

    // Песня по книге (если заказана и готова): слова; послушать — кнопкой «Песня» или по QR на задней обложке
    if (book.song && book.song.src && book.song.chorus) {
      const page = sheet('song');
      page.appendChild(el('div', 'song-kicker', 'Песня из сказки'));
      page.appendChild(el('div', 'song-title', '«' + book.song.title + '»'));
      page.appendChild(window.SkazkaExtras.songLyrics(book.song));
      page.appendChild(el('div', 'song-note', 'Послушать песню — в онлайн-версии книги'));
    }

    // Раскраска из иллюстраций книги
    (book.coloring || []).forEach(function (src, i) {
      const page = sheet('coloring');
      page.appendChild(el('div', 'coloring-title', i === 0 ? 'Раскрась свою сказку' : 'Раскраска'));
      const pic = document.createElement('img');
      pic.src = src;
      pic.alt = 'Раскраска ' + (i + 1);
      page.appendChild(pic);
    });

    backCover(book, name, window.SkazkaTemplate.normalizeInput(data.answers || {}).girl, data.jobId);
  }

  function attachActions(data) {
    const book = data.book;
    if (data.locked) {
      // в превью — только чтение и прослушивание; правки, продолжение и PDF — после оплаты
      document.getElementById('pdfBtn').style.display = 'none';
      document.getElementById('printBtn').style.display = 'none';
      document.getElementById('pdfHint').style.display = 'none';
      window.SkazkaExtras.attachListen(document.getElementById('listenBtn'), function () { return [book.title].concat(book.pages.map(pageText)); });
      return;
    }
    // озвучка рассказчиком (если уже готова), иначе — голос устройства
    window.SkazkaExtras.attachListen(document.getElementById('listenBtn'), function () {
      return [book.title].concat(book.pages.map(pageText));
    }, book.audio);
    window.SkazkaExtras.attachSong(document.getElementById('songBtn'), book.song);
    window.SkazkaExtras.attachEditor({
      button: document.getElementById('editBtn'),
      apiBase: API_BASE,
      jobId: data.jobId,
      canRedraw: data.canRedraw,
      redrawsLeft: data.redrawsLeft,
      editable: function () { return Array.prototype.slice.call(document.querySelectorAll('.sheet[data-page] .story p')); },
      collectEdits: function () {
        return Array.prototype.map.call(document.querySelectorAll('.sheet[data-page]'), function (s) {
          const i = Number(s.getAttribute('data-page'));
          const text = Array.prototype.map.call(s.querySelectorAll('.story p'), window.SkazkaExtras.paragraphText).filter(Boolean).join('\n');
          return { page: i, text: text };
        }).filter(function (e) { return e.text && e.text.replace(/\s+/g, ' ') !== pageText(book.pages[e.page]).replace(/\s+/g, ' '); });
      },
      images: function () {
        return Array.prototype.map.call(document.querySelectorAll('.sheet[data-page]'), function (s) {
          const i = s.getAttribute('data-page');
          const host = document.querySelector('.sheet[data-pic="' + i + '"] .hero') || s.querySelector('.scene');
          return host ? { img: host.querySelector('img'), host: host, index: Number(i) } : null;
        }).filter(Boolean);
      }
    });

    if (data.answers && data.answers.name && !params.get('demo')) {
      const btn = document.getElementById('sequelBtn');
      btn.hidden = false;
      btn.addEventListener('click', function () {
        const last = pageText(book.pages[book.pages.length - 1]);
        window.SkazkaExtras.orderSequel(data.answers, book.title, 'Чем закончилась: ' + last.slice(0, 600));
      });
    }
  }

  function pageText(page) {
    return typeof page === 'string' ? page : page.text;
  }

  // Подгоняем размер шрифта, чтобы текст целиком помещался на листе (и на экране, и в PDF)
  function fitText() {
    document.querySelectorAll('.story').forEach(function (story) {
      // лист только с текстом — крупный шрифт для чтения вслух малышам; подросткам — как раньше
      let size = story.closest('.text-page') && !document.body.classList.contains('teen') ? 26 : 19.5;
      story.style.setProperty('--fs', size + 'px');
      // предмет над текстом (160 px) — на каждой странице; если шрифт выходит мельче 21px, предмет уменьшается до 90 px
      const item = story.parentNode.querySelector('.page-item');
      const start = size;
      let ih = 160;
      for (;;) {
        if (item) item.style.setProperty('--ih', ih + 'px');
        size = start;
        story.style.setProperty('--fs', size + 'px');
        while (story.scrollHeight > story.clientHeight + 1 && size > 10) {
          size -= 0.25;
          story.style.setProperty('--fs', size + 'px');
        }
        if (!item || size >= 21 || ih <= 90) break;
        ih -= 14;
      }
    });
    fitBackText();
  }

  // Аннотация на задней обложке (у заказов — до 600 знаков) не должна наезжать на знак Героёнка и QR
  function fitBackText() {
    const text = document.querySelector('.back .back-text');
    const foot = document.querySelector('.back .back-foot');
    if (!text || !foot) return;
    const qr = document.querySelector('.back .back-qr');
    const limit = function () { return Math.min(foot.getBoundingClientRect().top, qr ? qr.getBoundingClientRect().top : Infinity) - 12; };
    let size = 24;
    text.style.fontSize = '';
    // масштаб листа (--scale) одинаково влияет на все рамки, поэтому сравниваем их напрямую
    while (text.getBoundingClientRect().bottom > limit() && size > 15) {
      size -= 0.5;
      text.style.fontSize = size + 'px';
    }
  }

  // Лист целиком помещается в окно — и по ширине, и по высоте
  function updateScale() {
    const bar = document.querySelector('.toolbar');
    const free = window.innerHeight - (bar ? bar.offsetHeight : 64) - 56;
    const scale = Math.max(0.3, Math.min(1, (window.innerWidth - 24) / SHEET_W, free / 1123));
    document.documentElement.style.setProperty('--scale', String(scale));
  }

  function showEmpty() {
    document.getElementById('pdfBtn').style.display = 'none';
    document.getElementById('printBtn').style.display = 'none';
    document.getElementById('pdfHint').style.display = 'none';
    const box = el('div', 'gw-card');
    const art = el('img', 'gw-art'); art.src = 'assets/brand/pose-walking.webp'; art.alt = 'Героёнок идёт с сумкой книг';
    box.append(art, el('h2', '', 'Здесь пока нет книги'), el('p', '', 'Героёнок отправится искать историю, как только вы расскажете о ребёнке. Заполните анкету — бесплатное превью появится здесь через пару минут.'));
    const actions = el('div', 'gw-actions');
    const a1 = el('a', 'gw-btn', 'К анкете'); a1.href = 'create.html';
    const a2 = el('a', 'gw-btn gw-ghost', 'Посмотреть пример'); a2.href = 'book-pro.html?demo=alex3d';
    actions.append(a1, a2);
    box.appendChild(actions);
    root.appendChild(box);
  }

  updateScale();
  window.addEventListener('resize', updateScale);

  function show(data) {
    if (!data) {
      showEmpty();
      return;
    }

    render(data);
    attachActions(data);
    fitText();
    // шрифты подгружаются с задержкой — после этого раскладка меняется, поэтому подгоняем ещё раз
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

    // «Скачать PDF» — файл формата A4 (страницы 794×1123 px); печать — запасной вариант внутри attachPdf
    const pdfBtn = document.getElementById('pdfBtn');
    // образцы — книги детей: полистать и послушать можно, забрать файлом — нет
    if (params.get('demo')) { pdfBtn.style.display = 'none'; document.getElementById('printBtn').style.display = 'none'; document.getElementById('pdfHint').style.display = 'none'; }
    window.SkazkaExtras.attachPdf(pdfBtn, {
      selector: '.sheet', widthMm: 210, heightMm: 297, scaleVar: '--scale',
      fileName: function () { return window.SkazkaExtras.pdfName(document.title.replace(/ — Героёнок$/, '')); }
    });
    // «Для типографии»: страницы без обложки + обложка одним листом (задняя, корешок, лицевая)
    window.SkazkaExtras.attachPrintKit(document.getElementById('printBtn'), {
      blockSelector: '.sheet:not(.cover):not(.back)', frontSelector: '.sheet.cover', backSelector: '.sheet.back',
      widthMm: 210, heightMm: 297, scaleVar: '--scale', spineColor: '#1c1a24', spineFont: "'Lora', Georgia, serif",
      title: function () { return document.title.replace(/ — Героёнок$/, ''); },
      fileBase: function () { return window.SkazkaExtras.pdfName(document.title.replace(/ — Героёнок$/, '')).replace(/\.pdf$/, ''); },
      pagesCount: function () { return document.querySelectorAll('.sheet:not(.cover):not(.back)').length; }
    });
    // ссылка «Скачать PDF» из анкеты (?print=1) — сразу собираем файл, когда книга и картинки готовы
    if (params.get('print') === '1') {
      Promise.all([waitForImages(), document.fonts ? document.fonts.ready : null]).then(function () {
        fitText();
        setTimeout(function () { pdfBtn.click(); }, 300);
      });
    }
  }

  const saved = params.get('demo') ? null : loadBook();
  const jobId = params.get('job') || (saved && saved.jobId);
  if (params.get('demo') === 'max3d') {
    // образец «Сказки» в 3D: книга Макса (иллюстрации — assets/examples/max-3d)
    const sm = document.createElement('script');
    sm.src = 'assets/examples/max-3d/book.js';
    sm.onload = function () { show(window.SKAZKA_MAX3D_BOOK); };
    sm.onerror = function () { show(null); };
    document.body.appendChild(sm);
  } else if (jobId) {
    loadFromServer(jobId).then(show, function () { show(params.get('demo') ? loadBook() : saved); });
  } else {
    show(loadBook());
  }
})();
</script>
</body>
</html>
